const el=id=>document.getElementById(id);let model;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normal=s=>s.toLowerCase().replace(/بيشوي/g,'بشوي').replace(/[أإآ]/g,'ا').replace(/[ً-ْـ]/g,'');

const faithName = new Map();
const byId = new Map();
for (const [faith, rows] of Object.entries(data)) {
  for (const row of rows) {
    faithName.set(row, faith === 'Islam' ? 'مزار إسلامي' : 'مزار مسيحي');
    byId.set(row[0], row);
  }
}
const picked = new Set();
const buttons = {All:'both', Islam:'mus', Christianity:'chr'};
function select(section) {
  model = section;
  for (const [key, id] of Object.entries(buttons)) el(id).setAttribute('aria-pressed', key === section);
  const rows = section === 'All' ? [...byId.values()] : data[section];
  const region = el('reg').options.length ? el('reg').value : '*';
  const regions = [...new Set(rows.map(row => row[3]))].sort();
  el('reg').replaceChildren(new Option('كل المناطق','*'));
  for (const value of regions) el('reg').add(new Option(value || 'المنطقة غير مسجلة',value));
  if (regions.includes(region)) el('reg').value = region;
  el('info').textContent = section === 'All' ? 'تُعرض النتائج بالتناوب بين القسمين، حسب ترتيب كل نموذج.' :
    section === 'Islam' ? 'النتائج حسب ترتيب النموذج الإسلامي.' : 'النتائج حسب التشابه مع أمثلة المواقع المسيحية الموثقة.';
  render();
}
function matches(row) {
  return (el('reg').value === '*' || el('reg').value === row[3]) &&
    normal(row.slice(0,3).join(' ')).includes(normal(el('q').value.trim())) &&
    (!el('doc').checked || row[13] === 'documented_significance');
}
function render() {
  let found;
  if (model === 'All') {
    const a = data.Islam.filter(matches), b = data.Christianity.filter(matches);
    found = [];
    for (let i=0; i<Math.max(a.length,b.length); i++) {
      if (a[i]) found.push(a[i]);
      if (b[i]) found.push(b[i]);
    }
  } else found = data[model].filter(matches);
  const show = found.slice(0, Number(el('limit').value));
  el('count').textContent = 'معروض '+show.length+' من '+found.length+' نتيجة مطابقة';
  el('results').innerHTML = show.map(r => '<article><small>'+faithName.get(r)+'</small><br><b>'+esc(r[1])+'</b> · '+esc(r[3]||'منطقة غير مسجلة')+'<p>ترتيب داخل النموذج '+r[5]+' · درجة النموذج '+r[4].toFixed(4)+(r[6]?' · معلّق للمراجعة':'')+'</p><details><summary>بيانات المكان</summary><small>'+esc(r[2])+' · '+esc(r[0])+' · '+esc(r[12])+'<br>الإحداثيات '+esc(r[10])+', '+esc(r[11])+'<br>الرسوم المسجلة بالجنيه | مصري '+esc(r[8]||'غير معلوم')+' · أجنبي '+esc(r[9]||'غير معلوم')+'</small>'+(r[6]?'<p>'+esc(r[6])+'</p>':'')+(r[15]?'<p>'+esc(r[15])+'</p>':'')+(r[16].startsWith('https://')?'<a target="_blank" rel="noopener" href="'+esc(r[16])+'">مرجع مراجعة الموقع</a>':'')+(r[14]?'<p>'+esc(r[14])+'</p>':'')+(r[7].startsWith('https://')?' <a target="_blank" rel="noopener" href="'+esc(r[7])+'">مصدر الأهمية</a>':'')+'</details><button data-pick="'+esc(r[0])+'" aria-pressed="'+picked.has(r[0])+'">'+(picked.has(r[0])?'إزالة من رحلتي':'إضافة إلى رحلتي')+'</button></article>').join('') || 'لا توجد نتائج مطابقة.';
  el('tripSize').textContent = picked.size;
  el('stops').innerHTML = [...picked].map(id => {
    const row = byId.get(id);
    return '<li>'+esc(row[1])+' · '+faithName.get(row)+' <button data-pick="'+esc(id)+'">إزالة</button></li>';
  }).join('');
}
for (const [key, id] of Object.entries(buttons)) el(id).onclick = () => select(key);
for (const id of ['q','reg','doc','limit']) el(id).oninput = render;
document.addEventListener('click', event => {
  const id = event.target.closest('button[data-pick]')?.dataset.pick;
  if (!byId.has(id)) return;
  if (picked.has(id)) picked.delete(id); else picked.add(id);
  render();
});
select('All');
</script></html>
